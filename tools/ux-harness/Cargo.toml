[package]
name = "ux-harness"
version = "0.1.0"
edition = "2021"
publish = false
description = "Headless UX audit harness for Robrix2: drives the app through makepad's internal event protocol, captures frames, and scores the result."

# The harness is a *driver*: it never links the app. It is a member of the
# root workspace (see ../../Cargo.toml) so `cargo test --workspace` and
# agent-spec `Package: ux-harness` selectors cover its tests, but it is not a
# dependency of `robrix` — a plain `cargo build` at the repo root still builds
# only the app.

[[bin]]
name = "ux-harness"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
png = "0.18"
