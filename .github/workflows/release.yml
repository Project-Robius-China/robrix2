# Robrix Release CI Workflow

name: Robrix Release CI

on:
  push:
    tags:
      - 'v*.*.*'    # Release Version Tags
      - 'v*.*.*-*'  # Pre-release Version Tags
  workflow_dispatch:
    inputs:
      build_ubuntu_24_x86_64:
        description: 'Build Ubuntu 24.04 x86_64'
        required: false
        type: boolean
        default: false
      build_ubuntu_24_aarch64:
        description: 'Build Ubuntu 24.04 aarch64'
        required: false
        type: boolean
        default: false
      build_ubuntu_22_x86_64:
        description: 'Build Ubuntu 22.04 x86_64'
        required: false
        type: boolean
        default: false
      build_ubuntu_22_aarch64:
        description: 'Build Ubuntu 22.04 aarch64'
        required: false
        type: boolean
        default: false
      build_macos_14_aarch64:
        description: 'Build macOS 14 (Apple Silicon)'
        required: false
        type: boolean
        default: false
      build_macos_15_x86_64:
        description: 'Build macOS 15 (Intel)'
        required: false
        type: boolean
        default: false
      build_windows_2022_x86_64:
        description: 'Build Windows 2022 x86_64'
        required: false
        type: boolean
        default: false
      build_android_aarch64:
        description: 'Build Android APK (aarch64 only)'
        required: false
        type: boolean
        default: false
      build_ios:
        description: 'Build iOS app'
        required: false
        type: boolean
        default: false
      upload_testflight:
        description: "Upload to TestFlight (true/false)"
        type: boolean
        default: false
      release_tag:
        description: 'Release tag (required if creating release)'
        required: false
        type: string
        default: ''
      create_release:
        description: 'Create a GitHub Release'
        required: true
        type: boolean
        default: false
      pre_release:
        description: 'Mark as a pre-release'
        required: true
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write
env:
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: short
  # Every job here produces a distributable. Packagers copy `resources/` by
  # value (symlinks dereferenced), so builds must never link host system
  # fonts — that would ship PingFang / Microsoft YaHei inside the package.
  # See build.rs `link_system_cjk_font`.
  ROBRIX_BUNDLED_FONTS: "1"

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  clippy_report:
    name: Clippy Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libssl-dev \
            libsqlite3-dev \
            pkg-config \
            llvm \
            clang \
            libclang-dev \
            libxcursor-dev \
            libx11-dev \
            libasound2-dev \
            libpulse-dev \
            libwayland-dev libxkbcommon-dev

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: ""
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-clippy-report

      - name: Run clippy
        shell: bash
        run: |
          set -o pipefail
          cargo clippy --workspace --all-features 2>&1 | tee clippy.log

      - name: Summarize and enforce gate
        if: always()
        shell: bash
        run: |
          echo "## Clippy Gate for $(git rev-parse --short HEAD)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          # Count warnings via the #[warn(...)] annotation line that clippy
          # emits for each flagged lint. This is more accurate than counting
          # "^warning:" header lines because cargo itself can emit meta-warnings
          # (e.g. "warning: skipping duplicate package ...") that are not lints.
          warn_count=$(grep -cE '#\[warn\(' clippy.log || true)
          error_count=$(grep -cE '^error:' clippy.log || true)
          echo "- Warnings: ${warn_count:-0}" >> $GITHUB_STEP_SUMMARY
          echo "- Errors: ${error_count:-0}" >> $GITHUB_STEP_SUMMARY
          if [[ "${warn_count:-0}" -gt 0 ]]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### Warning categories" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            grep -oE '#\[warn\([^)]+\)\]' clippy.log | sed -E 's/#\[warn\((.*)\)\]/\1/' | sort | uniq -c | sort -rn >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi
          # Hard gate: any warning or error here fails this job, which
          # cascades through create_release.needs to block every build
          # and publish step. Release cannot ship with dirty clippy state.
          if [[ "${warn_count:-0}" -gt 0 || "${error_count:-0}" -gt 0 ]]; then
            echo "::error::Clippy gate failed: ${warn_count:-0} warning(s), ${error_count:-0} error(s). See summary above."
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: clippy-log
          path: clippy.log
          retention-days: 30

  check_tag_version:
    name: Check Release Tag and Cargo.toml Version Consistency
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Check tag and Cargo.toml version
        run: |
          TAG_REF="${GITHUB_REF##*/}"
          echo "Current tag: $TAG_REF"

          CARGO_MANIFEST_VERSION=$(cargo metadata --no-deps --format-version 1 --frozen | jq -r '.packages[] | select(.name=="robrix") | .version' | head -n1)
          if [[ -z "$CARGO_MANIFEST_VERSION" || "$CARGO_MANIFEST_VERSION" == "null" ]]; then
            echo "Error: Failed to resolve robrix version from Cargo metadata."
            exit 1
          fi
          echo "Cargo.toml Robrix version: $CARGO_MANIFEST_VERSION"

          if [[ "$TAG_REF" != "v$CARGO_MANIFEST_VERSION" ]]; then
            echo "Error: Tag '$TAG_REF' does not match Cargo.toml version '$CARGO_MANIFEST_VERSION'."
            echo "Please create a tag that matches the Cargo.toml version."
            exit 1
          else
            echo "Tag and Cargo.toml version are consistent."
          fi

  determine_matrices:
    name: Determine Build Matrices
    runs-on: ubuntu-latest
    outputs:
      linux_matrix: ${{ steps.set.outputs.linux_matrix }}
      macos_matrix: ${{ steps.set.outputs.macos_matrix }}
      windows_matrix: ${{ steps.set.outputs.windows_matrix }}
      run_linux: ${{ steps.set.outputs.run_linux }}
      run_macos: ${{ steps.set.outputs.run_macos }}
      run_windows: ${{ steps.set.outputs.run_windows }}
    steps:
      - name: Build matrix from inputs
        id: set
        uses: actions/github-script@v7
        with:
          script: |
            const isPush = context.eventName === 'push';
            const inputs = context.payload.inputs || {};
            const enabled = (value) => String(value).trim().toLowerCase() === 'true';

            const linux = [];
            const macos = [];
            const windows = [];

            const addLinux = (os, arch, artifact_platform) =>
              linux.push({ os, arch, artifact_platform });
            const addMacos = (os, arch) => macos.push({ os, arch });
            const addWindows = () => windows.push({ os: 'windows-2022', arch: 'x86_64' });

            if (isPush) {
              addLinux('ubuntu-24.04', 'x86_64', 'ubuntu-24.04');
              addLinux('ubuntu-24.04-arm', 'aarch64', 'ubuntu-24.04');
              addLinux('ubuntu-22.04', 'x86_64', 'ubuntu-22.04');
              addLinux('ubuntu-22.04-arm', 'aarch64', 'ubuntu-22.04');
              addMacos('macos-14', 'aarch64');
              addMacos('macos-15-intel', 'x86_64');
              addWindows();
            } else {
              if (enabled(inputs.build_ubuntu_24_x86_64)) addLinux('ubuntu-24.04', 'x86_64', 'ubuntu-24.04');
              if (enabled(inputs.build_ubuntu_24_aarch64)) addLinux('ubuntu-24.04-arm', 'aarch64', 'ubuntu-24.04');
              if (enabled(inputs.build_ubuntu_22_x86_64)) addLinux('ubuntu-22.04', 'x86_64', 'ubuntu-22.04');
              if (enabled(inputs.build_ubuntu_22_aarch64)) addLinux('ubuntu-22.04-arm', 'aarch64', 'ubuntu-22.04');
              if (enabled(inputs.build_macos_14_aarch64)) addMacos('macos-14', 'aarch64');
              if (enabled(inputs.build_macos_15_x86_64)) addMacos('macos-15-intel', 'x86_64');
              if (enabled(inputs.build_windows_2022_x86_64)) addWindows();
            }

            core.setOutput('linux_matrix', JSON.stringify({ include: linux }));
            core.setOutput('macos_matrix', JSON.stringify({ include: macos }));
            core.setOutput('windows_matrix', JSON.stringify({ include: windows }));
            core.setOutput('run_linux', linux.length > 0 ? 'true' : 'false');
            core.setOutput('run_macos', macos.length > 0 ? 'true' : 'false');
            core.setOutput('run_windows', windows.length > 0 ? 'true' : 'false');

  create_release:
    name: Create Release
    needs: [check_tag_version, determine_matrices, clippy_report]
    if: >-
      ${{ always() && needs.clippy_report.result == 'success' && (
        (github.event_name == 'push' && needs.check_tag_version.result == 'success') ||
        (github.event_name == 'workflow_dispatch' &&
          github.event.inputs.create_release == 'true' &&
          (
            needs.determine_matrices.outputs.run_linux == 'true' ||
            needs.determine_matrices.outputs.run_macos == 'true' ||
            needs.determine_matrices.outputs.run_windows == 'true' ||
            github.event.inputs.build_android_aarch64 == 'true' ||
            github.event.inputs.build_ios == 'true'
          )
        )
      ) }}
    runs-on: ubuntu-22.04
    outputs:
      release_id: ${{ steps.create_release.outputs.id }}
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve release metadata
        id: resolve
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_RELEASE_TAG: ${{ github.event.inputs.release_tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [[ "$EVENT_NAME" == "push" ]]; then
            resolved_tag="$REF_NAME"
          else
            resolved_tag="$INPUT_RELEASE_TAG"
            if [[ -z "$resolved_tag" ]]; then
              resolved_version="$(awk '
                /^\[package\]$/ { in_package=1; next }
                /^\[/ { in_package=0 }
                in_package && $1 == "version" {
                  gsub(/"/, "", $3);
                  print $3;
                  exit;
                }
              ' Cargo.toml)"
              if [[ -z "$resolved_version" ]]; then
                echo "Error: Unable to resolve package.version from Cargo.toml."
                exit 1
              fi
              resolved_tag="v${resolved_version}"
              echo "release_tag not provided; fallback to ${resolved_tag}"
            fi
          fi

          echo "tag=${resolved_tag}" >> "$GITHUB_OUTPUT"
          echo "name=Robrix ${resolved_tag}" >> "$GITHUB_OUTPUT"

      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.resolve.outputs.tag }}
          name: ${{ steps.resolve.outputs.name }}
          draft: ${{ github.event_name == 'workflow_dispatch' }}
          prerelease: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.pre_release == 'true') || (github.event_name == 'push' && contains(github.ref, '-')) }}
          token: ${{ secrets.ROBRIX_RELEASE }}

      - name: Verify release access
        shell: bash
        run: |
          gh api "repos/${{ github.repository }}/releases/${{ steps.create_release.outputs.id }}" --jq '.id'
        env:
          GH_TOKEN: ${{ secrets.ROBRIX_RELEASE }}

  for_linux:
    name: Release Robrix for Linux (${{ matrix.os }}, ${{ matrix.arch }})
    needs: [check_tag_version, determine_matrices, create_release]
    if: ${{ always() && ((github.event_name == 'push' && needs.check_tag_version.result == 'success') || (github.event_name == 'workflow_dispatch' && needs.determine_matrices.outputs.run_linux == 'true')) }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.determine_matrices.outputs.linux_matrix) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux necessary dependencies
        if: matrix.os == 'ubuntu-22.04' || matrix.os == 'ubuntu-22.04-arm' || matrix.os == 'ubuntu-24.04' || matrix.os == 'ubuntu-24.04-arm'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libssl-dev \
            libsqlite3-dev \
            pkg-config \
            llvm \
            clang \
            libclang-dev \
            binfmt-support \
            libxcursor-dev \
            libx11-dev \
            libasound2-dev \
            libpulse-dev \
            libwayland-dev libxkbcommon-dev

      - name: Install Rust Stable
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: ""

      - name: Package (desktop)
        uses: project-robius/makepad-packaging-action@v1
        env:
          CARGO_PACKAGER_SIGNING_KEY: ${{ secrets.CARGO_PACKAGER_SIGNING_KEY }}
          CARGO_PACKAGER_SIGNING_PASSWORD: ${{ secrets.CARGO_PACKAGER_SIGNING_PASSWORD }}
          CARGO_PACKAGER_SIGN_PRIVATE_KEY: ${{ secrets.CARGO_PACKAGER_SIGN_PRIVATE_KEY || secrets.CARGO_PACKAGER_SIGNING_KEY }}
          CARGO_PACKAGER_SIGN_PRIVATE_KEY_PASSWORD: ${{ secrets.CARGO_PACKAGER_SIGN_PRIVATE_KEY_PASSWORD || secrets.CARGO_PACKAGER_SIGNING_PASSWORD }}
          ROBRIX_UPDATER_PUBKEY: ${{ secrets.CARGO_PACKAGER_SIGN_PUBLIC_KEY }}
          ROBRIX_UPDATER_ENDPOINT: https://github.com/${{ github.repository }}/releases/latest/download/latest.json
        with:
          github_token: ${{ secrets.ROBRIX_RELEASE }}
          packager_formats: deb
          asset_name_template: __APP__-__VERSION__-${{ matrix.artifact_platform }}-__ARCH__-__MODE__.__EXT__
          uploadUpdaterJson: true
          uploadUpdaterSignatures: true
          releaseId: ${{ needs.create_release.outputs.release_id }}

  for_macos:
    name: Release Robrix for macOS (${{ matrix.os }}, ${{ matrix.arch }})
    needs: [check_tag_version, determine_matrices, create_release]
    if: ${{ always() && ((github.event_name == 'push' && needs.check_tag_version.result == 'success') || (github.event_name == 'workflow_dispatch' && needs.determine_matrices.outputs.run_macos == 'true')) }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.determine_matrices.outputs.macos_matrix) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust Stable
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: ""

      - name: Package (macos)
        uses: project-robius/makepad-packaging-action@v1
        env:
          CARGO_PACKAGER_SIGNING_KEY: ${{ secrets.CARGO_PACKAGER_SIGNING_KEY }}
          CARGO_PACKAGER_SIGNING_PASSWORD: ${{ secrets.CARGO_PACKAGER_SIGNING_PASSWORD }}
          CARGO_PACKAGER_SIGN_PRIVATE_KEY: ${{ secrets.CARGO_PACKAGER_SIGN_PRIVATE_KEY || secrets.CARGO_PACKAGER_SIGNING_KEY }}
          CARGO_PACKAGER_SIGN_PRIVATE_KEY_PASSWORD: ${{ secrets.CARGO_PACKAGER_SIGN_PRIVATE_KEY_PASSWORD || secrets.CARGO_PACKAGER_SIGNING_PASSWORD }}
          ROBRIX_UPDATER_PUBKEY: ${{ secrets.CARGO_PACKAGER_SIGN_PUBLIC_KEY }}
          ROBRIX_UPDATER_ENDPOINT: https://github.com/${{ github.repository }}/releases/latest/download/latest.json
          # APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          # APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APP_STORE_CONNECT_API_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        with:
          github_token: ${{ secrets.ROBRIX_RELEASE }}
          packager_formats: dmg
          enable_macos_notarization: false
          uploadUpdaterJson: true
          uploadUpdaterSignatures: true
          releaseId: ${{ needs.create_release.outputs.release_id }}

  for_windows:
    name: Release Robrix for Windows (${{ matrix.os }}, ${{ matrix.arch }})
    needs: [check_tag_version, determine_matrices, create_release]
    if: ${{ always() && ((github.event_name == 'push' && needs.check_tag_version.result == 'success') || (github.event_name == 'workflow_dispatch' && needs.determine_matrices.outputs.run_windows == 'true')) }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.determine_matrices.outputs.windows_matrix) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust Stable
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: ""

      - name: Package (windows)
        uses: project-robius/makepad-packaging-action@v1
        env:
          CARGO_PACKAGER_SIGNING_KEY: ${{ secrets.CARGO_PACKAGER_SIGNING_KEY }}
          CARGO_PACKAGER_SIGNING_PASSWORD: ${{ secrets.CARGO_PACKAGER_SIGNING_PASSWORD }}
          CARGO_PACKAGER_SIGN_PRIVATE_KEY: ${{ secrets.CARGO_PACKAGER_SIGN_PRIVATE_KEY || secrets.CARGO_PACKAGER_SIGNING_KEY }}
          CARGO_PACKAGER_SIGN_PRIVATE_KEY_PASSWORD: ${{ secrets.CARGO_PACKAGER_SIGN_PRIVATE_KEY_PASSWORD || secrets.CARGO_PACKAGER_SIGNING_PASSWORD }}
          ROBRIX_UPDATER_PUBKEY: ${{ secrets.CARGO_PACKAGER_SIGN_PUBLIC_KEY }}
          ROBRIX_UPDATER_ENDPOINT: https://github.com/${{ github.repository }}/releases/latest/download/latest.json
        with:
          github_token: ${{ secrets.ROBRIX_RELEASE }}
          packager_formats: nsis
          uploadUpdaterJson: true
          uploadUpdaterSignatures: true
          releaseId: ${{ needs.create_release.outputs.release_id }}

  for_android:
    name: Release Robrix for Android (aarch64)
    needs: [check_tag_version, create_release]
    if: ${{ always() && ((github.event_name == 'push' && needs.check_tag_version.result == 'success') || (github.event_name == 'workflow_dispatch' && github.event.inputs.build_android_aarch64 == 'true')) }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust Stable
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: ""

      - name: Package (android)
        uses: project-robius/makepad-packaging-action@v1
        env:
          AWS_LC_SYS_CMAKE_BUILDER: 1
          MAKEPAD_ANDROID_FULL_NDK: true
          MAKEPAD_MOBILE_CARGO_EXTRA_ARGS: >-
            --config profile.dev.opt-level=0
            --config profile.dev.debug=false
            --config profile.dev.lto=false
            --config profile.dev.strip=true
            --config profile.dev.debug-assertions=false
        with:
          github_token: ${{ secrets.ROBRIX_RELEASE }}
          args: --target aarch64-linux-android
          releaseId: ${{ needs.create_release.outputs.release_id }}

  for_ios:
    name: Release Robrix for iOS
    needs: [check_tag_version, create_release]
    if: ${{ always() && ((github.event_name == 'push' && needs.check_tag_version.result == 'success') || (github.event_name == 'workflow_dispatch' && github.event.inputs.build_ios == 'true')) }}
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust Stable
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: ""

      - name: Package (iOS)
        uses: project-robius/makepad-packaging-action@v1
        env:
          AWS_LC_SYS_CMAKE_BUILDER: 1
          MAKEPAD_MOBILE_CARGO_EXTRA_ARGS: >-
            --config profile.dev.opt-level=0
            --config profile.dev.debug=false
            --config profile.dev.lto=false
            --config profile.dev.strip=true
            --config profile.dev.debug-assertions=false
          MAKEPAD_IOS_ORG: org.robius.robrix
          MAKEPAD_IOS_APP: Robrix
          MAKEPAD_IOS_CREATE_IPA: 'true'
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_PROVISIONING_PROFILE: ${{ secrets.APPLE_PROVISIONING_PROFILE }}
          APPLE_KEYCHAIN_PASSWORD: ${{ secrets.APPLE_KEYCHAIN_PASSWORD }}
          APPLE_SIGNING_IDENTITY: Apple Development
          APP_STORE_CONNECT_API_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        with:
          github_token: ${{ secrets.ROBRIX_RELEASE }}
          upload_to_testflight: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.upload_testflight == 'true' }}
          args: --target aarch64-apple-ios
          releaseId: ${{ needs.create_release.outputs.release_id }}

  publish_distribution:
    name: Publish installers and package metadata
    needs: [create_release, for_linux, for_macos, for_windows]
    if: >-
      ${{
        always() &&
        needs.create_release.result == 'success' &&
        needs.for_linux.result == 'success' &&
        needs.for_macos.result == 'success' &&
        needs.for_windows.result == 'success'
      }}
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      tag: ${{ steps.metadata.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve distribution metadata
        id: metadata
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.create_release.outputs.tag }}
        run: |
          set -euo pipefail
          echo "tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Generate checksum-pinned distribution assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.ROBRIX_RELEASE }}
          RELEASE_ID: ${{ needs.create_release.outputs.release_id }}
          RELEASE_TAG: ${{ needs.create_release.outputs.tag }}
        run: |
          set -euo pipefail
          generated=false
          for attempt in $(seq 1 12); do
            gh api "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" \
              --jq '.assets' > release-assets.json
            rm -rf distribution
            if ./scripts/generate-distribution-assets.sh \
              --repository "$GITHUB_REPOSITORY" \
              --tag "$RELEASE_TAG" \
              --assets-json release-assets.json \
              --output distribution; then
              generated=true
              break
            fi
            echo "attempt ${attempt}/12: waiting for GitHub asset digests..."
            sleep 10
          done
          if [[ "$generated" != true ]]; then
            echo "::error::Could not generate distribution assets after waiting for release uploads."
            exit 1
          fi
          ./scripts/test-distribution.sh

      - name: Upload installers and package metadata to the release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.ROBRIX_RELEASE }}
          RELEASE_TAG: ${{ needs.create_release.outputs.tag }}
          VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          set -euo pipefail
          gh release upload "$RELEASE_TAG" \
            distribution/robrix-installer.sh \
            distribution/robrix-installer.ps1 \
            distribution/SHA256SUMS \
            distribution/robrix-dist-manifest.json \
            "distribution/robrix-${VERSION}-npm-package.tgz" \
            "distribution/robrix-${VERSION}-winget-manifests.zip" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

      - name: Preserve distribution assets for registry jobs
        uses: actions/upload-artifact@v4
        with:
          name: robrix-distribution-assets
          path: distribution/
          retention-days: 14

  publish_npm:
    name: Publish npm installer wrapper
    needs: publish_distribution
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Check npm publishing credentials
        id: credentials
        shell: bash
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [[ -n "$NPM_TOKEN" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::NPM_TOKEN is not configured; the npm package remains attached to the GitHub release."
          fi

      - uses: actions/download-artifact@v4
        if: ${{ steps.credentials.outputs.enabled == 'true' }}
        with:
          name: robrix-distribution-assets
          path: distribution

      - uses: actions/setup-node@v4
        if: ${{ steps.credentials.outputs.enabled == 'true' }}
        with:
          node-version: "20"
          registry-url: https://registry.npmjs.org

      - name: Publish stable to latest and prerelease to next
        if: ${{ steps.credentials.outputs.enabled == 'true' }}
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          VERSION: ${{ needs.publish_distribution.outputs.version }}
          RELEASE_TAG: ${{ needs.publish_distribution.outputs.tag }}
        run: |
          set -euo pipefail
          if [[ "$RELEASE_TAG" == *-* ]]; then
            npm_tag=next
          else
            npm_tag=latest
          fi
          npm publish "distribution/robrix-${VERSION}-npm-package.tgz" \
            --access public \
            --tag "$npm_tag"

  publish_homebrew:
    name: Update the Homebrew cask
    needs: publish_distribution
    if: ${{ github.event_name == 'push' && !contains(github.ref_name, '-') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.ROBRIX_RELEASE }}

      - uses: actions/download-artifact@v4
        with:
          name: robrix-distribution-assets
          path: distribution

      - name: Stage the release cask
        id: cask
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p Casks
          cp distribution/Casks/robrix.rb Casks/robrix.rb
          if git diff --quiet -- Casks/robrix.rb; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open a cask update pull request
        if: ${{ steps.cask.outputs.changed == 'true' }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.ROBRIX_RELEASE }}
          RELEASE_TAG: ${{ needs.publish_distribution.outputs.tag }}
        run: |
          set -euo pipefail
          branch="distribution/homebrew-${RELEASE_TAG}"
          git config user.name "robrix-release-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add Casks/robrix.rb
          git commit -m "release: update Homebrew cask for ${RELEASE_TAG}"
          git push --force origin "$branch"

          existing_url=$(gh pr list --head "$branch" --json url --jq '.[0].url // empty')
          if [[ -n "$existing_url" ]]; then
            echo "Updated existing Homebrew pull request: $existing_url"
          else
            gh pr create \
              --base main \
              --head "$branch" \
              --title "release: update Homebrew cask for ${RELEASE_TAG}" \
              --body "Automated checksum and version update for the Robrix Homebrew cask."
          fi

  publish_winget:
    name: Submit the Winget manifest
    needs: publish_distribution
    if: ${{ github.event_name == 'push' && !contains(github.ref_name, '-') }}
    runs-on: windows-2022
    steps:
      - name: Check Winget publishing credentials
        id: credentials
        shell: pwsh
        env:
          WINGET_CREATE_GITHUB_TOKEN: ${{ secrets.WINGET_CREATE_GITHUB_TOKEN }}
        run: |
          if ($env:WINGET_CREATE_GITHUB_TOKEN) {
            "enabled=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          } else {
            "enabled=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            Write-Output "::notice::WINGET_CREATE_GITHUB_TOKEN is not configured; manifests remain attached to the GitHub release."
          }

      - uses: actions/download-artifact@v4
        if: ${{ steps.credentials.outputs.enabled == 'true' }}
        with:
          name: robrix-distribution-assets
          path: distribution

      - name: Submit manifests to microsoft/winget-pkgs
        if: ${{ steps.credentials.outputs.enabled == 'true' }}
        shell: pwsh
        env:
          WINGET_CREATE_GITHUB_TOKEN: ${{ secrets.WINGET_CREATE_GITHUB_TOKEN }}
          VERSION: ${{ needs.publish_distribution.outputs.version }}
        run: |
          Invoke-WebRequest https://aka.ms/wingetcreate/latest -OutFile wingetcreate.exe
          $manifestPath = "distribution/winget/ProjectRobiusChina.Robrix/$env:VERSION"
          ./wingetcreate.exe submit `
            --prtitle "New version: ProjectRobiusChina.Robrix version $env:VERSION" `
            --no-open `
            $manifestPath
