# Robrix Build CI Workflow
# This workflow builds the Robrix project across multiple platforms including desktop and mobile.
# It includes 3 main hosts: macOS, Linux, and Windows for 5 targets: MacOS, Linux, Windows, IOS, and Android.

# Build Robrix Matrix Coverage:
# ┌─────────────────┬─────────────────┬─────────────────┐
# │   Host OS       │   Target        │   Build Tool    │
# ├─────────────────┼─────────────────┼─────────────────┤
# │ Ubuntu Latest   │ Linux x86_64    │ cargo build     │
# │ macOS 15 Intel  │ macOS x86_64    │ cargo build     │
# │ macOS 14 ARM64  │ macOS ARM64     │ cargo build     │
# │ Windows 2022    │ Windows x86_64  │ cargo build     │
# │ macOS 14        │ iOS aarch64     │ cargo-makepad   │
# │ macOS 14        │ Android         │ cargo-makepad   │
# │ Ubuntu Latest   │ Android         │ cargo-makepad   │
# │ Windows 2022    │ Android         │ cargo-makepad   │
# └─────────────────┴─────────────────┴─────────────────┘

name: Robrix Build CI

on:
  push:
    branches:
      - main
    paths:
        - packaging/**
        - resources/**
        - src/**
        - .github/**
        - .cargo/**
        - Cargo.lock
        - Cargo.toml
        - rust-toolchain.toml
        # ignore files
        - '!**/*.md'
        - '!LICENSE-MIT'
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - main
    paths:
        - packaging/**
        - resources/**
        - src/**
        - .github/**
        - .cargo/**
        - Cargo.lock
        - Cargo.toml
        - rust-toolchain.toml
        # ignore files
        - '!**/*.md'
        - '!LICENSE-MIT'
env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_INCREMENTAL: 0

jobs:
  # ═══════════════════════════════════════════════════════════════════════════════════════
  # NATIVE DESKTOP BUILDS
  # These jobs build Robrix for desktop platforms using standard cargo build
  # ═══════════════════════════════════════════════════════════════════════════════════════
  build_ubuntu:
    name: Build Ubuntu
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libssl-dev \
            libsqlite3-dev \
            pkg-config \
            llvm \
            clang \
            libclang-dev \
            binfmt-support \
            libxcursor-dev \
            libx11-dev \
            libasound2-dev \
            libpulse-dev \
            libwayland-dev libxkbcommon-dev

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: ""

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: ubuntu-build-${{ hashFiles('Cargo.lock') }}

      - name: Build
        run: |
          cargo build --profile fast

  build_macos:
    name: Build macOS (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    if: github.event.pull_request.draft == false
    strategy:
      fail-fast: false
      matrix:
        include:
          # Apple Silicon Macs (M1/M2/M3/M4 chips)
          - os: macos-14
            arch: arm64
          # Intel Macs (x86_64 architecture)
          - os: macos-15-intel
            arch: x86_64
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: ""

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: macos-${{ matrix.arch }}-build-${{ hashFiles('Cargo.lock') }}

      - name: Build
        run: |
          cargo build --profile fast

  build_windows:
    name: Build Windows
    runs-on: windows-2022
    if: github.event.pull_request.draft == false
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: ""

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: windows-build-${{ hashFiles('Cargo.lock') }}

      - name: Build
        run: |
          cargo build --profile fast

  # ═══════════════════════════════════════════════════════════════════════════════════════
  # CROSS-PLATFORM MOBILE BUILDS
  # These jobs use cargo-makepad for mobile cross-compilation
  # ═══════════════════════════════════════════════════════════════════════════════════════

  build_ios_on_macos:
    name: Build iOS (macOS Host)
    runs-on: macos-14
    if: github.event.pull_request.draft == false
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (pinned via rust-toolchain.toml)
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: ""

      - name: Install Rust nightly
        run: |
          rustup toolchain install nightly

      - name: Setup cargo-makepad
        uses: ./.github/actions/setup-cargo-makepad

      - name: Install iOS toolchain
        run: |
          cargo makepad apple ios install-toolchain

      - name: Install bindgen-cli for aws-lc-sys cross-compilation
        run: |
          cargo install --force --locked bindgen-cli

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: ios-macos-build-${{ hashFiles('Cargo.lock') }}

      - name: Build for iOS targets
        env:
          AWS_LC_SYS_CMAKE_BUILDER: 1
          # Package build: bundled OFL fonts only, never the host's (see build.rs).
          ROBRIX_BUNDLED_FONTS: "1"
        run: |
          # Install iOS targets
          rustup target add aarch64-apple-ios

          # Build the iOS simulator and device targets
          cargo makepad apple ios \
          --org=rs.robius \
          --app=robrix \
          build -p robrix \
          --config profile.dev.opt-level=0 \
          --config profile.dev.debug=false \
          --config profile.dev.lto=\"off\" \
          --config profile.dev.strip=true \
          --config profile.dev.debug-assertions=false

  build_android_on_macos:
    name: Build Android (macOS Host)
    runs-on: macos-14
    if: github.event.pull_request.draft == false
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: ""

      - name: Setup cargo-makepad
        uses: ./.github/actions/setup-cargo-makepad

      - name: Install Android toolchain
        run: |
          cargo makepad android install-toolchain --full-ndk

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: android-macos-build-${{ hashFiles('Cargo.lock') }}

      - name: Build Android APK
        env:
          AWS_LC_SYS_CMAKE_BUILDER: 1
          # Package build: bundled OFL fonts only, never the host's (see build.rs).
          ROBRIX_BUNDLED_FONTS: "1"
        run: |
          cargo makepad android build -p robrix \
          --config profile.dev.opt-level=0 \
          --config profile.dev.debug=false \
          --config profile.dev.lto=\"off\" \
          --config profile.dev.strip=true \
          --config profile.dev.debug-assertions=false

  build_android_on_linux:
    name: Build Android (Linux Host)
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: ""

      - name: Setup cargo-makepad
        uses: ./.github/actions/setup-cargo-makepad

      - name: Install Android toolchain
        run: |
          cargo makepad android install-toolchain --full-ndk

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: android-linux-build-${{ hashFiles('Cargo.lock') }}

      - name: Build Android APK
        env:
          AWS_LC_SYS_CMAKE_BUILDER: 1
          # Package build: bundled OFL fonts only, never the host's (see build.rs).
          ROBRIX_BUNDLED_FONTS: "1"
        run: |
          cargo makepad android build -p robrix \
          --config profile.dev.opt-level=0 \
          --config profile.dev.debug=false \
          --config profile.dev.lto=\"off\" \
          --config profile.dev.strip=true \
          --config profile.dev.debug-assertions=false

      # Guard against #303: packagers copy resources/ by value, so the APK must
      # contain exactly one copy of the bundled OFL CJK font (as system_cjk.ttc)
      # and never a host system font. Fails the job if the manifest drifts.
      - name: Check APK ships only bundled fonts
        run: |
          set -euo pipefail
          # cargo-makepad writes to <target>/android/makepad-android-apk/<crate>/apk/
          # (or <CARGO_TARGET_DIR>/makepad-android-apk/... when that var is set).
          apk=$(find target -path '*/makepad-android-apk/robrix/apk/*.apk' ! -name '*.unaligned.apk' | head -1)
          [ -n "$apk" ] || { echo "::error::no APK found under target/"; find target -name '*.apk' -maxdepth 6; exit 1; }
          echo "APK: $apk ($(stat -c %s "$apk") bytes)"
          echo "--- font entries ---"
          unzip -l "$apk" | grep -E 'assets/makepad/robrix/(resources/fonts|fonts)/' | tee fonts.txt
          fail=0
          # The bundled CJK fallback must not ship under its own name (it lives
          # in bundled_fonts/, outside resources/), only as system_cjk.ttc.
          if grep -q 'LXGWWenKaiRegular.ttf' fonts.txt; then echo "::error::LXGWWenKaiRegular.ttf shipped under its own name (duplicate)"; fail=1; fi
          # No host system fonts, ever.
          if grep -qiE 'PingFang|Hiragino|STHeiti|SFNS|HelveticaNeue|msyh|simhei|segoeui|arial|NotoSansCJK|DejaVu|LiberationSans' fonts.txt; then echo "::error::host system font found in APK"; fail=1; fi
          # system_cjk.ttc must be byte-identical to the bundled LXGWWenKai,
          # system_latin.ttf to the bundled LiberationMono.
          mkdir -p apk_fonts && unzip -o -q "$apk" 'assets/makepad/robrix/resources/fonts/system_*' -d apk_fonts
          for pair in "system_cjk.ttc:bundled_fonts/LXGWWenKaiRegular.ttf" "system_latin.ttf:resources/fonts/LiberationMono-Regular.ttf"; do
            name=${pair%%:*}; src=${pair#*:}
            got=$(sha256sum "apk_fonts/assets/makepad/robrix/resources/fonts/$name" | cut -d' ' -f1)
            want=$(sha256sum "$src" | cut -d' ' -f1)
            if [ "$got" = "$want" ]; then echo "OK  $name == $src"; else echo "::error::$name differs from $src"; fail=1; fi
          done
          exit $fail

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: robrix-android-debug-apk
          path: target/**/makepad-android-apk/robrix/apk/*.apk
          retention-days: 7
          if-no-files-found: error

  build_android_on_windows:
    name: Build Android (Windows Host)
    runs-on: windows-2022
    if: github.event.pull_request.draft == false
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: ""

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: android-windows-build-${{ hashFiles('Cargo.lock') }}

      - name: Setup cargo-makepad
        uses: ./.github/actions/setup-cargo-makepad

      - name: Install Android toolchain
        run: |
          cargo makepad android install-toolchain --full-ndk

      - name: Install Ninja
        run: choco install ninja -y
        shell: powershell

      - name: Build Android APK
        env:
          AWS_LC_SYS_CMAKE_BUILDER: 1
          # Package build: bundled OFL fonts only, never the host's (see build.rs).
          ROBRIX_BUNDLED_FONTS: "1"
          CMAKE_GENERATOR: Ninja
        run: |
          ## Note: we can't use the profile here because cargo-makepad doesn't support custom profiles.
          # cargo makepad android build -p robrix --profile fast
          cargo makepad android build -p robrix \
          --config profile.dev.opt-level=0 \
          --config profile.dev.debug=false \
          --config profile.dev.lto=\"off\" \
          --config profile.dev.strip=true \
          --config profile.dev.debug-assertions=false

  # Build Summary
  build_summary:
    name: Robrix Build Results Summary
    runs-on: ubuntu-latest
    needs: [
      build_ubuntu,
      build_macos,
      build_windows,
      build_ios_on_macos,
      build_android_on_macos,
      build_android_on_linux,
      build_android_on_windows
    ]
    if: always()

    steps:
      - run: |
          echo "=== Desktop Builds ==="
          echo "Ubuntu: ${{ needs.build_ubuntu.result }}"
          echo "macOS: ${{ needs.build_macos.result }}"
          echo "Windows: ${{ needs.build_windows.result }}"
          echo "=== iOS Builds ==="
          echo "iOS (macOS): ${{ needs.build_ios_on_macos.result }}"
          echo "=== Android Builds ==="
          echo "Android (macOS): ${{ needs.build_android_on_macos.result }}"
          echo "Android (Linux): ${{ needs.build_android_on_linux.result }}"
          echo "Android (Windows): ${{ needs.build_android_on_windows.result }}"

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
